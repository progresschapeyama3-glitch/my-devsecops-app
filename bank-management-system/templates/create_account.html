{% extends "base.html" %}

{% block content %}
<div class="form-wrapper">
    <div class="section-heading">
        <div>
            <p class="eyebrow">CUSTOMER ONBOARDING</p>
            <h1>Create Bank Account</h1>
            <p class="muted">Create a new customer and account.</p>
        </div>
    </div>

    <form method="POST" class="form-card">
        <div class="form-grid">
            <label>
                Customer ID
                <input name="customer_id" placeholder="C001" required>
            </label>

            <label>
                Full Name
                <input name="name" placeholder="John Smith" required>
            </label>

            <label>
                Email
                <input type="email" name="email"
                       placeholder="john@example.com" required>
            </label>

            <label>
                Account Number
                <input name="account_number"
                       placeholder="SA001" required>
            </label>

            <label>
                Account Type
                <select name="account_type" required>
                    <option value="savings">Savings Account</option>
                    <option value="current">Current Account</option>
                    <option value="business">Business Account</option>
                </select>
            </label>

            <label>
                Initial Balance (AED)
                <input type="number" name="initial_balance"
                       min="0" step="0.01" value="0" required>
            </label>
        </div>

        <div class="form-actions">
            <a class="button secondary" href="{{ url_for('index') }}">Cancel</a>
            <button class="button" type="submit">Create Account</button>
        </div>
    </form>
</div>
{% endblock %}
